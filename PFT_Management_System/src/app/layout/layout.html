<div class="d-flex min-vh-100 bg-body-tertiary">
    <!-- Sidebar Navigation -->
    <app-sidebar [isToggled]="isSidebarToggled" (closeSidebar)="isSidebarToggled = false"></app-sidebar>

    <!-- Main Layout Container -->
    <div class="d-flex flex-column flex-grow-1 min-vh-100 overflow-hidden">
        <!-- Top Header Navigation -->
        <app-header (toggleSidebar)="isSidebarToggled = !isSidebarToggled"></app-header>

        <!-- Main Content Area -->
        <main class="flex-grow-1 py-4 overflow-y-auto">
            <div class="container-fluid px-3 px-md-4">
                <router-outlet></router-outlet>
            </div>
        </main>

        <!-- Footer -->
        <app-footer class="mt-auto"></app-footer>
    </div>
</div>
