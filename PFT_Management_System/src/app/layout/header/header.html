<nav class="navbar navbar-expand navbar-dark bg-dark border-bottom border-secondary shadow-sm py-2">
    <div class="container-fluid px-3">
        <!-- Hamburger Toggler -->
        <button class="btn btn-dark border-0 shadow-none me-2 d-flex align-items-center justify-content-center p-2" type="button" (click)="onToggleClick()" aria-label="Toggle navigation">
            <i class="bi bi-list fs-4"></i>
        </button>

        <!-- Brand logo/name -->
        <a class="navbar-brand d-flex align-items-center fw-bold gap-2 text-white me-auto" routerLink="/dashboard">
            <img src="favicon.ico" alt="Logo" style="height: 24px; width: 24px;">
            <span class="fs-5">PFT Portal</span>
        </a>

        <!-- Right Side Controls -->
        <div class="d-flex align-items-center gap-2">
            <!-- Install PWA Button -->
            <div *ngIf="showInstallButton" class="d-none d-sm-block">
                <button (click)="installApp()" class="btn btn-primary btn-sm d-flex align-items-center gap-1.5 py-1.5 px-3 rounded-pill shadow-sm">
                    <i class="bi bi-download"></i>
                    <span>Install App</span>
                </button>
            </div>

            <!-- User Profile Dropdown -->
            <div class="dropdown position-relative">
                <button
                    class="btn btn-outline-light border-0 dropdown-toggle text-start d-flex align-items-center gap-2 py-2 px-2.5 rounded-3"
                    type="button" id="userMenuButton" (click)="toggleDropdown($event)" aria-expanded="false">
                    <i class="bi bi-person-circle fs-5 text-primary"></i>
                    <span class="fw-medium d-none d-md-inline">{{ user?.name || 'User' }}</span>
                </button>

                <ul class="dropdown-menu dropdown-menu-end border-0 shadow-lg mt-2 py-2 rounded-3 position-absolute"
                    [class.show]="isDropdownOpen" aria-labelledby="userMenuButton"
                    (click)="isDropdownOpen = false" style="right: 0; left: auto; min-width: 200px; z-index: 1050;">
                    <li class="px-3 py-2 border-bottom mb-2 bg-light">
                        <div class="fw-bold text-dark small">{{ user?.name }}</div>
                        <div class="text-secondary small opacity-75">{{ user?.email }}</div>
                        <span *ngIf="user?.isAdmin"
                            class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill px-2 py-0.5 mt-1 small">Admin</span>
                    </li>
                    <li>
                        <a class="dropdown-item d-flex align-items-center gap-2 py-2 text-dark"
                            routerLink="/profile">
                            <i class="bi bi-person text-secondary"></i> My Profile
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item d-flex align-items-center gap-2 py-2 text-dark"
                            routerLink="/settings">
                            <i class="bi bi-gear text-secondary"></i> Settings
                        </a>
                    </li>
                    <li>
                        <hr class="dropdown-divider my-2">
                    </li>
                    <li>
                        <button class="dropdown-item d-flex align-items-center gap-2 py-2 text-danger" type="button"
                            (click)="logout()">
                            <i class="bi bi-box-arrow-right"></i> Sign Out
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>
